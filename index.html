<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zane | Systems & Detailing</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #0070f3;
            --text: #ededed;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            border: 1px solid #333;
            padding: 3rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }
        p {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .btn {
            background-color: var(--text);
            color: var(--bg);
            padding: 0.8rem 2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: var(--accent);
            color: white;
        }
        .status {
            margin-top: 2rem;
            font-family: monospace;
            font-size: 0.8rem;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Zane Risinger</h1>
        <p>High-Performance Systems & Mobile Detailing.</p>
        
        <a href="mailto:your-email@example.com" class="btn">Get in Touch</a>

        <div class="status">
            [ Deployment: Successful ]<br>
            [ System: Optimized ]
        </div>
    </div>

</body>
</html>
